<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>SKU Vendedor</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00539b">

<style>
body{
    font-family: Arial, sans-serif;
    max-width:700px;
    margin:auto;
    padding:15px;
    background:#f5f7fa;
}

h1{
    text-align:center;
    color:#00539b;
}

input{
    width:100%;
    padding:14px;
    font-size:20px;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

.tarjeta{
    background:#fff;
    margin-top:15px;
    padding:15px;
    border-radius:12px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.dato{
    margin:8px 0;
}

.etiqueta{
    font-weight:bold;
    color:#00539b;
}

.sku{
    display:inline-block;
    background:#eaf4ff;
    border:1px solid #b7d9ff;
    margin:4px;
    padding:8px 12px;
    border-radius:8px;
    font-weight:bold;
}

.error{
    background:#fff3f3;
    color:#c00000;
    padding:12px;
    border-radius:8px;
    margin-top:15px;
}

.estado{
    text-align:center;
    color:#666;
    margin-bottom:10px;
    font-size:14px;
}
</style>
</head>
