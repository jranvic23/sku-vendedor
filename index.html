<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SKU</title><style>body{font-family:Arial;max-width:700px;margin:auto;padding:15px}input{width:100%;padding:12px;font-size:20px}.sku{display:inline-block;background:#eaf4ff;margin:4px;padding:8px;border-radius:6px}</style></head><body><h2>Consulta SKU Faltantes</h2><input id=c placeholder="Número de cliente"><div id=r></div><script>let d={};fetch('clientes.json').then(r=>r.json()).then(j=>d=j);c.oninput=()=>{let x=d[c.value];r.innerHTML=x?'<h3>'+x.nombre+'</h3>'+x.skus.map(s=>'<span class=sku>'+s+'</span>').join(''):'Cliente no encontrado';}</script></body></html>
